<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Enquête école — Saisie et analyse</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: #f5f6f2; color: #253c34; font: 14px system-ui, sans-serif; }
    iframe { display: block; flex: 1; width: 100%; min-height: 0; border: 0; }
    footer { padding: .4rem .8rem; text-align: right; border-top: 1px solid #dfe5dd; }
    a { color: inherit; }
    noscript { padding: 1rem; }
  </style>
</head>
<body>
  <iframe id="enquete" title="Enquête école" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
  <footer><a id="direct" href="https://ecole-enquete-collective.gutgiles.chatgpt.site/" target="_blank" rel="noopener noreferrer">Ouvrir l’outil directement</a></footer>
  <noscript>Active JavaScript pour utiliser l’outil.</noscript>
  <script>
    const hosted = 'https://ecole-enquete-collective.gutgiles.chatgpt.site/';
    function loadStudy() {
      const key = new URLSearchParams(location.hash.slice(1)).get('etude');
      const url = new URL(hosted);
      if (key) url.hash = new URLSearchParams({ etude: key }).toString();
      document.getElementById('enquete').src = url.href;
      document.getElementById('direct').href = url.href;
    }
    loadStudy();
    addEventListener('hashchange', loadStudy);
  </script>
</body>
</html>
